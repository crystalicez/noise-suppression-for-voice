name: Refresh RNNoise model once

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  refresh-model:
    # One-shot helper: it removes itself after committing the official model data.
    if: github.head_ref == 'update-rnnoise-vst2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Download and verify Xiph model
        shell: bash
        run: |
          set -euxo pipefail
          cd external/rnnoise
          expected="$(cat model_version)"
          archive="rnnoise_data-${expected}.tar.gz"
          xiph_url="https://media.xiph.org/rnnoise/models/${archive}"
          mirror_url="https://ftp.uni-erlangen.de/mirrors/gentoo/distfiles/dd/${archive}"

          # Prefer Xiph. GitHub-hosted runners currently time out reaching
          # media.xiph.org, so use a public mirror only as a transport fallback.
          if ! wget --timeout=15 --tries=1 -O "${archive}" "${xiph_url}"; then
            rm -f "${archive}"
            wget --timeout=30 --tries=2 -O "${archive}" "${mirror_url}"
          fi

          # model_version is the SHA-256 published by the Xiph source tree.
          # This makes a mirror copy acceptable only if it is byte-identical.
          echo "${expected}  ${archive}" | sha256sum --check --strict
          tar xvomf "${archive}"

      - name: Verify generated runtime model changed
        shell: bash
        run: |
          set -euxo pipefail
          git status --short -- external/rnnoise/src/rnnoise_data.c external/rnnoise/src/rnnoise_data.h external/rnnoise/src/rnnoise_data_little.c
          if git diff --quiet -- external/rnnoise/src/rnnoise_data.c external/rnnoise/src/rnnoise_data.h external/rnnoise/src/rnnoise_data_little.c; then
            echo "Verified model archive did not change any bundled runtime model files" >&2
            exit 1
          fi

      - name: Commit refreshed model and remove helper
        shell: bash
        run: |
          set -euxo pipefail
          rm -f .github/workflows/refresh-rnnoise-model-once.yml
          rm -f external/rnnoise/rnnoise_data-*.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/refresh-rnnoise-model-once.yml external/rnnoise/src/rnnoise_data.c external/rnnoise/src/rnnoise_data.h external/rnnoise/src/rnnoise_data_little.c
          git diff --cached --stat
          git commit -m "rnnoise: refresh bundled model data"
          git push origin HEAD:${{ github.head_ref }}
